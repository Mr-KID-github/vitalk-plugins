name: Plugin review
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: validator
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install trusted validator only
        working-directory: validator
        run: npm ci --ignore-scripts
      - name: Check trusted validator
        working-directory: validator
        run: npm test
      - name: Read added metadata through GitHub API only
        working-directory: validator
        run: node tools/review.mjs "$RUNNER_TEMP/submission"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Check metadata and actual Release bytes
        run: node validator/tools/check.mjs "$RUNNER_TEMP/submission" --changes-file "$RUNNER_TEMP/submission/reviewed-paths.json"
        env:
          GH_TOKEN: ${{ github.token }}
